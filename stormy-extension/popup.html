<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{margin:0;width:260px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#f4f0fa;color:#211b30}
  header{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
  header img{width:44px;height:44px}
  h1{font-size:16px;margin:0}
  p{margin:2px 0 0;font-size:12px;color:#615778}
  label{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:14px;cursor:pointer}
  label + label{border-top:1px solid #e4ddf0}
  input{width:18px;height:18px;accent-color:#6b4fd8}
  footer{padding:10px 16px 14px;font-size:11.5px;color:#615778;line-height:1.4}
  @media (prefers-color-scheme: dark){body{background:#1b1828;color:#eeeaf8}p,footer{color:#a59dbb}label + label{border-color:#2f2942}}
</style>
</head>
<body>
  <header><img src="art/stormy-envelope.png" alt=""><div><h1>Stormy Walk</h1><p>Keeps watch while your AI works</p></div></header>
  <label>Stormy on the page <input type="checkbox" id="pet"></label>
  <label>Tiny walking cats <input type="checkbox" id="cats"></label>
  <label>Meows <input type="checkbox" id="sound"></label>
  <footer>Works on ChatGPT, Gemini, Claude, Perplexity, DeepSeek, Copilot, Mistral and Grok in the browser.</footer>
  <script src="popup.js"></script>
</body>
</html>
